# Preproduction locale Vululu V1 — moteur Hatchet, PostgreSQL, S3-compatible, TLS.
# ATTENTION : topologie NON EXECUTEE dans son ensemble lors de la Mission 05 :
#  - Hatchet + son PostgreSQL ont demarre et produit un handshake valide ;
#  - le serveur S3 rclone TLS a ete execute sur l'hote et valide par les tests ;
#  - le daemon Docker Desktop est ensuite devenu read-only (disque WSL plein),
#    bloquant le demarrage de la topologie complete. Voir docs/reports/VULULU_PREPROD_EVIDENCE.md.
name: vululu-preprod
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vululu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vululu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vululu -d vululu"]
      interval: 5s
      timeout: 5s
      retries: 20

  cert-init:
    image: node:24-bookworm-slim
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends openssl
        if [ -f /certs/server.crt ]; then echo "CERT_ALREADY_PRESENT"; exit 0; fi
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /certs/ca.key -out /certs/ca.crt -days 30 -subj "/CN=Vululu Preprod CA"
        openssl req -newkey rsa:2048 -nodes -keyout /certs/server.key -out /certs/server.csr -subj "/CN=s3"
        printf 'subjectAltName=DNS:s3,DNS:localhost,IP:127.0.0.1,IP:::1\n' > /certs/san.cnf
        openssl x509 -req -in /certs/server.csr -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial -out /certs/server.crt -days 30 -sha256 -extfile /certs/san.cnf
        echo "CERT_READY"
    volumes:
      - certs:/certs

  s3:
    build:
      context: ../..
      dockerfile: infra/preprod/Dockerfile.s3
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - s3data:/data
      - certs:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:9000/ | grep -v 000"]
      interval: 10s
      timeout: 5s
      retries: 12

  hatchet-pg:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: ${HATCHET_PG_PASSWORD:?set HATCHET_PG_PASSWORD}
      POSTGRES_DB: hatchet
    volumes:
      - hatchetpg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet -d hatchet"]
      interval: 5s
      timeout: 5s
      retries: 20

  hatchet:
    build:
      context: ../..
      dockerfile: infra/preprod/Dockerfile.hatchet
    restart: unless-stopped
    environment:
      HATCHET_DATABASE_URL: postgresql://hatchet:${HATCHET_PG_PASSWORD:?set HATCHET_PG_PASSWORD}@hatchet-pg:5432/hatchet?sslmode=disable
    volumes:
      - hatchetruntime:/data
    depends_on:
      hatchet-pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/handshake.json"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  s3data:
  certs:
  hatchetpg:
  hatchetruntime:
